<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Solicitudes</title>
    <link rel="stylesheet" href="Pagina4.css">
</head>
<body class="mobile-bg">

    <div class="mobile-container">
        <header class="header-solicitudes">
            <h1>Mi solicitudes</h1>
            <div class="user-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png" alt="Usuario">
            </div>
        </header>

        <main class="list-container">
            
            <div class="request-card">
                <span class="status-badge">En revision</span>
                <div class="card-content">
                    <img src="https://www.faunaencasa.com/wp-content/uploads/2021/06/198919999_185752536810723_4971914811602515136_n-566x566.jpg" alt="Copito" class="pet-img">
                    <div class="pet-details">
                        <h2>Copito</h2>
                        <p>Solicitud # 34109</p>
                        <p>Fecha: 21/03/2026</p>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="icons">🗓️ 🐾 🔍</div>
                    <button class="btn-details">Ver detalles</button>
                </div>
            </div>

            <div class="request-card">
                <span class="status-badge">Aprovado</span>
                <div class="card-content">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR94sK74aFCwU1HsIkfY0RuorVK7VbO2JNZkQ&s" alt="Chiki" class="pet-img">
                    <div class="pet-details">
                        <h2>Chiki</h2>
                        <p>Solicitud # 26570</p>
                        <p>Fecha: 14/03/2026</p>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="icons">🗓️ 🐾 🔍</div>
                    <button class="btn-details">Ver detalles</button>
                </div>
            </div>

            <div class="request-card">
                <span class="status-badge">Finalizado</span>
                <div class="card-content">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQN5CGJKiSE5Pwsa71iUqq_UmAYpijT6xZH9A&s" alt="Milo" class="pet-img">
                    <div class="pet-details">
                        <h2>Milo</h2>
                        <p>Solicitud # 4C580</p>
                        <p>Fecha: 10/02/2026</p>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="icons">🗓️ 🐾 🔍</div>
                    <button class="btn-details">Ver detalles</button>
                </div>
            </div>

        </main>
    </div>
    <script src="Pagina4.js"></script>
</body>
</html>
