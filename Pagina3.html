<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Adopcion</title>
    <link rel="stylesheet" href="Pagina3.css">
</head>
<body class="mobile-bg">

    <div class="mobile-container">
        <header class="header">
            <span class="back-arrow">＜</span>
            <h1>Formulario de adopcion</h1>
        </header>

        <div class="pet-card">
            <img src="https://www.faunaencasa.com/wp-content/uploads/2021/06/198919999_185752536810723_4971914811602515136_n-566x566.jpg" alt="Copito" class="pet-thumb">
            <div class="pet-info">
                <strong>Copito</strong>
                <span>1 año</span>
            </div>
        </div>

        <form class="adoption-form">
            <div class="input-group">
                <label>Nombre completo</label>
                <input type="text" placeholder="Nombre completo">
            </div>

            <div class="input-group">
                <label>Numero de telefono</label>
                <input type="text" placeholder="Numero de telefono">
            </div>

            <div class="input-group">
                <label>Razon por la adopcion</label>
                <textarea placeholder="Razon por la adopcion"></textarea>
                <small>Requerida</small>
            </div>

            <button type="button" class="btn-submit">Enviar solicitud</button>
        </form>
    </div>
   <script src="Pagina3.js"></script>
</body>
</html>
